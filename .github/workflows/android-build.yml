name: Android Build & APK Delivery

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Set up Gradle Cache & Environment
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --continue --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK Generation
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Expected APK not found at $APK_PATH" >&2
            exit 1
          fi
          FILE_SIZE=$(stat -c%s "$APK_PATH")
          if [ "$FILE_SIZE" -le 1000 ]; then
            echo "ERROR: Generated APK is empty or suspiciously small ($FILE_SIZE bytes)" >&2
            exit 1
          fi
          echo "Verified APK at $APK_PATH: $FILE_SIZE bytes"

      - name: Prepare Output Directory & Checksums
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/GCamCompatibleCamera-debug.apk
          cd output
          sha256sum GCamCompatibleCamera-debug.apk > SHA256SUMS.txt
          cd ..
          cat output/SHA256SUMS.txt

      - name: Package Clean Source Archive
        run: |
          mkdir -p output
          zip -r output/GCamCompatibleCamera-Source.zip . \
            -x "*.git*" \
            -x "*build/*" \
            -x "*.gradle*" \
            -x "*reference/*" \
            -x "*output/*" \
            -x "*.idea*" \
            -x "*.iml" \
            -x "*local.properties"
          cd output
          sha256sum GCamCompatibleCamera-Source.zip >> SHA256SUMS.txt
          cd ..
          echo "Source archive created: $(stat -c%s output/GCamCompatibleCamera-Source.zip) bytes"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GCamCompatibleCamera-debug-apk
          path: |
            output/GCamCompatibleCamera-debug.apk
            output/SHA256SUMS.txt
          retention-days: 30

      - name: Upload Source Code Archive
        uses: actions/upload-artifact@v4
        with:
          name: GCamCompatibleCamera-source
          path: output/GCamCompatibleCamera-Source.zip
          retention-days: 30

      - name: Upload Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GCamCompatibleCamera-test-reports
          path: |
            app/build/reports/
          retention-days: 14

  release:
    name: Publish GitHub Release (Tag Triggers)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          name: GCamCompatibleCamera-debug-apk
          path: release-assets/

      - name: Download Source Archive
        uses: actions/download-artifact@v4
        with:
          name: GCamCompatibleCamera-source
          path: release-assets/

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/GCamCompatibleCamera-debug.apk
            release-assets/GCamCompatibleCamera-Source.zip
            release-assets/SHA256SUMS.txt
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
